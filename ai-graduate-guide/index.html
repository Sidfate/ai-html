养与系统","url":"https://www.cse.neu.edu.cn/2023/1214/c6273a240109/page.htm"},{"label":"学科简介","url":"https://www.cse.neu.edu.cn/6284/list.htm"},{"label":"学院科研平台","url":"https://www.cse.neu.edu.cn/_s131/main.psp"}]},{"school":"中南大学","region":"中国内地","ratings":{"research":4,"foundation":5,"practice":null,"industry":null,"breadth":3},"evidence":{"research":"具身智能、图形图像、大数据智能软件与数字健康有研究特色。","foundation":"算法理论、系统网络、软件和数据领域完整。","practice":"未核具体硕士工程实践安排，留空。","industry":"有企业委托科研但未核具体稳定合作平台及硕士路径，留空。","breadth":"核CV、计算系统、机器人3类；ML/NLP专门证据待补。"},"sources":[{"label":"官方招生/复试公告","url":"https://cse.csu.edu.cn/__local/D/F1/F6/6A3DB95C183AAFC78040F17EA13_A63C8040_44A39.pdf"},{"label":"官方学院/研究/培养资料","url":"https://cse.csu.edu.cn/info/1057/11078.htm"},{"label":"2026学院简介","url":"https://cse.csu.edu.cn/xygk/xyjj.htm"}]},{"school":"吉林大学","region":"中国内地","ratings":{"research":4,"foundation":5,"practice":3,"industry":null,"breadth":2},"evidence":{"research":"知识工程、智能规划与自动推理等AI方向有长期研究。","foundation":"软件理论、系统结构与应用硕士体系完整。","practice":"硕士培养与科研训练可核，具体工程实践细则未核，按科研型训练初评。","industry":"本轮未核到合适企业合作证据，留空。","breadth":"核智能计算/学习及计算系统2类；不将图形学直接计CV。"},"sources":[{"label":"官方招生/复试公告","url":"https://ccst.jlu.edu.cn/info/1229/20883.htm"},{"label":"官方学院/研究/培养资料","url":"https://ccst.jlu.edu.cn/info/1229/20885.htm"},{"label":"学院简介","url":"https://ccst.jlu.edu.cn/info/1034/1005.htm"},{"label":"研究方向","url":"https://ccst.jlu.edu.cn/xygk/yzjy.htm"}]},{"school":"西北工业大学","region":"中国内地","ratings":{"research":4.5,"foundation":5,"practice":3,"industry":4,"breadth":4},"evidence":{"research":"智能计算架构、感知与媒体、群智计算等平台及语音语言团队持续研究。","foundation":"研究布局覆盖体系结构、复杂软件、数据、网络和智能决策。","practice":"代表专硕培养存在，公开材料主要为研究平台及硕士科研成果，工程实训细则未核；按科研/一般计算机训练保守初评。","industry":"腾讯媒体信息联合实验室及华为、百度科研平台稳定，未推定普通硕士固定企业实践。","breadth":"核智能计算/ML、视觉感知、NLP、计算系统4类；其他学院无人系统不自动计入。"},"sources":[{"label":"官方招生/复试公告","url":"https://jsj.nwpu.edu.cn/info/1599/29115.htm"},{"label":"科研方向","url":"https://jsj.nwpu.edu.cn/info/1556/7722.htm"},{"label":"学院简介","url":"https://jsj.nwpu.edu.cn/info/1506/6981.htm"},{"label":"语音语言合作平台","url":"https://jsj.nwpu.edu.cn/ypyyclz/hzdw.htm"},{"label":"学院科研与培养","url":"https://www.nwpu.edu.cn/info/1198/92038.htm"}]},{"school":"南开大学","region":"中国内地","ratings":{"research":4,"foundation":5,"practice":3,"industry":3,"breadth":2},"evidence":{"research":"机器智能研究所及跨模态、人机情感交互有公开成果。","foundation":"软件理论、计算系统、应用与安全硕士体系完整。","practice":"学院简介明确研究及实践能力培养，硕士科研路径可核；无具体工程实践细则。","industry":"分布式系统与百度的应用合作可核，仅按单一合作初评。","breadth":"明确核计算系统、AI学习/跨模态2类；细分CV/NLP及机器人待补。"},"sources":[{"label":"官方招生/复试公告","url":"https://cc.nankai.edu.cn/2026/0401/c13297a597350/page.htm"},{"label":"学院研究与培养","url":"https://cc.nankai.edu.cn/13256/list.htm"}]},{"school":"新加坡国立大学","region":"新加坡","ratings":{"research":4.5,"foundation":4.5,"practice":4,"industry":4,"breadth":5},"evidence":{"research":"计算机学院列有多个AI研究组，覆盖机器学习、视觉、语言、规划和机器人；本次按可核研究组织评价，不采用综合大学排名。","foundation":"MComp AI允许从计算机学院4000—6000级课程选修；学院另有HPC-AI及并行、分布式系统研究。基础广度较强，但具体系统课程仍取决于选课。","practice":"可选16学分导师指导的AI论文；研究实践路径明确，未据此假定每位学生都有企业实习。","industry":"学院列有NCS、Google等联合研究平台，可核实稳定产学联系；部分人才项目面向博士，不能当作MComp学生自动获得的机会。","breadth":"已核机器学习、计算机视觉、自然语言处理、计算系统、机器人五类；依据AI研究组与HPC-AI实验室页面。"},"sources":[{"label":"项目与申请要求","url":"https://www.comp.nus.edu.sg/programmes/pg/mcomp-ai/admissions/"},{"label":"学费","url":"https://www.comp.nus.edu.sg/programmes/pg/mcomp-ai/scholarships/"},{"label":"培养安排","url":"https://www.comp.nus.edu.sg/programmes/pg/mcomp-ai/"},{"label":"AI研究组","url":"https://www.comp.nus.edu.sg/cs/research/ai/groups/"},{"label":"学院研究合作平台","url":"https://www.comp.nus.edu.sg/research/research-initiatives/"},{"label":"HPC-AI实验室","url":"https://ai.comp.nus.edu.sg/index.html"}]},{"school":"南洋理工大学","region":"新加坡","ratings":{"research":4.5,"foundation":4,"practice":5,"industry":4,"breadth":5},"evidence":{"research":"CCDS有生成式AI、计算智能、多媒体交互等研究实验室；AI硕士课程覆盖多类前沿主题。","foundation":"硕士核心含AI数学、机器学习和深度学习；学院有网络、硬件、数据管理及并行分布式计算实验室。项目本身偏AI专门训练，通用软件与系统课不作必修假定。","practice":"项目官网明确列有课程项目、AI Master Project和实习机会，工程实践路径较完整；机会不等于保证分配实习。","industry":"Alibaba-NTU联合研究院提供持续AI产学平台；人才计划的特定身份或博士限制不外推给普通MSAI申请人。","breadth":"课程明确涵盖ML、CV、NLP、机器人；CCDS并行分布式计算实验室补足计算系统，五类均有来源。"},"sources":[{"label":"官方项目、要求与费用","url":"https://www.ntu.edu.sg/education/graduate-programme/master-of-science-in-artificial-intelligence"},{"label":"CCDS研究实验室","url":"https://www.ntu.edu.sg/computing/research/institutes-centres"},{"label":"Alibaba-NTU联合研究院","url":"https://www.ntu.edu.sg/alibaba-ntu-jri"}]},{"school":"香港科技大学","region":"中国香港","ratings":{"research":4.5,"foundation":4.5,"practice":4,"industry":3.5,"breadth":5},"evidence":{"research":"CSE研究主题页列出机器学习、语言、视觉等多组教师与实验室，具备明确的AI研究环境；学院实力与新硕士项目历史分别看待。","foundation":"CSE研究覆盖理论、数据管理、软件与编程语言、网络和系统；AI项目课程以Python及AI基础为核心，通用CS深度仍需自行选课补充。","practice":"2026/27课程表列6学分Independent Project，可跨两学期完成；新版页面不能沿用旧宣传册的必修capstone要求。","industry":"BDI官方介绍列有WeChat-HKUST联合AI实验室等合作。部分介绍属历史平台，且普通AI硕士参与路径未明确，因此保守评价。","breadth":"CSE主题页明确涉及ML、CV、NLP、计算系统及机器人/运动控制；并不意味着该硕士每位学生都覆盖全部方向。"},"sources":[{"label":"2026/27项目目录","url":"https://prog-crs.hkust.edu.hk/pgprog/2026-27/msc-ai"},{"label":"2027年秋入学费用","url":"https://seng.hkust.edu.hk/zh-hant/academics/taught-postgraduate/msc-ai"},{"label":"项目开设信息","url":"https://career.hkust.edu.hk/web/public/STEM_2025_26_Eligible_Programm.pdf"},{"label":"2026/27课程安排","url":"https://seng.hkust.edu.hk/academics/taught-postgraduate/msc-ai/course-schedule"},{"label":"CSE研究主题","url":"https://cse.hkust.edu.hk/pg/research/themes/"},{"label":"大数据研究院合作平台","url":"https://cse.hkust.edu.hk/BDI/research.html"}]},{"school":"爱丁堡大学","region":"英国","ratings":{"research":4.5,"foundation":4.5,"practice":4,"industry":4,"breadth":5},"evidence":{"research":"信息学院有机器学习、语言认知计算、机器人等研究组织，教师研究目录能核实多个AI方向。","foundation":"信息学院研究目录横跨计算机科学与AI；本次项目要求扎实数学与编程，课程可兼顾理论和实现，但具体系统选课需再核。","practice":"AI MSc包含独立硕士论文，研究训练明确；此处未把论文当作强制企业实习。","industry":"信息学院有正式的企业合作硕士项目机制：企业可提出项目，学生也可自拟企业课题；须有Informatics内部导师与外部企业导师，并按常规分配流程审批。可参与渠道明确，但不保证实习或特定企业项目。","breadth":"信息学院研究目录覆盖ML、视觉、语言、计算系统、机器人；这里衡量学院环境而非单一学生的课程组合。"},"sources":[{"label":"项目与申请要求","url":"https://study.ed.ac.uk/programmes/postgraduate-taught/107-artificial-intelligence"},{"label":"2026/27学费表","url":"https://registryservices.ed.ac.uk/tuition-fees/find/postgraduate-taught/2026-2027/taught-masters"},{"label":"信息学院研究方向与教师目录","url":"https://people.inf.ed.ac.uk/research-directory.html"},{"label":"语言认知计算研究所","url":"https://www.inf.ed.ac.uk/research/ilcc/"},{"label":"信息学院硕士论文课程","url":"https://www.drps.ed.ac.uk/24-25/dpt/cxinfr11077.htm"},{"label":"信息学院硕士企业合作项目机制","url":"https://opencourse.inf.ed.ac.uk/diss/projects-with-industrial-collaborators"},{"label":"企业导师与内部共同指导要求","url":"https://auth.opencourse.inf.ed.ac.uk/diss/external-supervisors"}]},{"school":"萨尔大学","region":"德国","ratings":{"research":4.5,"foundation":4.5,"practice":4.5,"industry":3.5,"breadth":4},"evidence":{"research":"DSAI由计算机、语言科学与技术系及校园六个研究中心共同参与教学；校园研究组包含AI基础、视觉机器学习与语言系统。","foundation":"项目含DSAI核心、计算机核心、数学统计、数据管理和安全等内容，兼顾AI与计算机基础。","practice":"课程允许把企业实习与研究组实习计入选修要求，并有硕士论文；实践安排较充分，但不保证岗位。","industry":"项目明确允许企业实习，校园亦有DFKI等应用研究组织；未据此声称普遍就业成果或特定公司录用。","breadth":"已核ML、CV、NLP、分布式/计算系统四类。此次未获得足够直接的项目或校园机器人方向证据，因此该项不计。"},"sources":[{"label":"官方项目与要求","url":"https://www.uni-saarland.de/en/study/programmes/master/data-science.html"},{"label":"校园AI与机器学习研究","url":"https://saarland-informatics-campus.de/forschung-research/artifical-intelligence-and-machine-learning-foundations-and-application/"},{"label":"校园研究组","url":"https://saarland-informatics-campus.de/forschung-research/forschungsgruppen-der-saarbruecker-informatik/"}]},{"school":"斯坦福大学","region":"美国","ratings":{"research":5,"foundation":5,"practice":5,"industry":4.5,"breadth":5},"evidence":{"research":"SAIL列有多支视觉、语言、机器学习、机器人团队，研究博客持续发布具体工作；研究组织与成果证据同时存在。","foundation":"MS有Foundations、Breadth、Depth要求；专业方向覆盖理论、系统、信息管理与分析，另设实质软件实现要求，CS基础完整。","practice":"MS明确要求Significant Software Implementation，即通过课程证明大规模软件开发能力；还可规划研究或符合条件的实习。","industry":"SAIL与工程学院均有产业会员平台，官网说明教师和学生参与企业问题交流；具体实习或实验室席位不保证。","breadth":"SAIL研究组覆盖ML、CV、NLP和机器人，MS系统方向补足计算系统，五类全部有依据。"},"sources":[{"label":"MS项目与学制","url":"https://www.cs.stanford.edu/masters-program-overview"},{"label":"外部申请者招生FAQ","url":"https://www.cs.stanford.edu/admissions/masters-admissions-frequently-asked-questions"},{"label":"MS专业方向","url":"https://www.cs.stanford.edu/masters-specializations"},{"label":"MS基础要求","url":"https://www.cs.stanford.edu/ms-requirements-foundations"},{"label":"MS软件实现要求","url":"https://www.cs.stanford.edu/ms-requirements-significant-software-implementation"},{"label":"SAIL研究组及产业联系","url":"https://ai.stanford.edu/research-groups/"},{"label":"SAIL机器人研究成果","url":"https://sail.stanford.edu/blog/robotics/index.html"},{"label":"工程学院产业会员平台","url":"https://engineering.stanford.edu/get-involved/industry-collaborations/affiliate-programs"},{"label":"研究生英语最低分及新旧TOEFL口径","url":"https://gradadmissions.stanford.edu/apply/test-scores"}]},{"school":"卡内基梅隆大学","region":"美国","ratings":{"research":5,"foundation":4.5,"practice":5,"industry":4.5,"breadth":5},"evidence":{"research":"SCS设机器学习、语言技术、机器人等专门部门；研究页面持续列出生成式AI、感知与机器人等具体研究方向。","foundation":"MSAII有计算机系统预备课、coding bootcamp、机器学习和深度学习等知识要求；偏AI专门训练，广泛系统选修需自行安排。","practice":"四学期产品开发序列包括AI Engineering、AI Innovation、36-unit capstone与关联暑期实习的practicum，工程训练有明确课程载体。","industry":"项目要求与外部利益相关方合作开发AI产品，并将暑期实践与课程衔接；多种学生参与路径可核，但企业录用不保证。","breadth":"SCS研究及MSAII课程共同覆盖ML、CV、NLP、计算系统和机器人五类。"},"sources":[{"label":"MSAII项目、课程及申请","url":"https://www.lti.cmu.edu/academics/masters-programs/msaii.html"},{"label":"MSAII招生材料说明","url":"https://www.lti.cs.cmu.edu/academics/masters-programs/msaii.html"},{"label":"SCS研究方向","url":"https://www.cs.cmu.edu/research/"},{"label":"SCS组织与研究部门","url":"https://www.cs.cmu.edu/about/"},{"label":"机器人研究","url":"https://csd.cs.cmu.edu/research/research-areas/robotics"},{"label":"MSAII官方FAQ：GPA、语言和GRE要求","url":"https://msaii.cs.cmu.edu/frequently-asked-questions"}]},{"school":"加州大学伯克利分校","region":"美国","ratings":{"research":5,"foundation":4.5,"practice":5,"industry":4.5,"breadth":5},"evidence":{"research":"BAIR聚合视觉、机器学习、语言、规划、控制和机器人教师研究群体；是可核实的跨团队研究环境。","foundation":"EECS MEng数据科学选修包括算法、编程语言、并行计算等，另有计算系统方向；仅四门技术课，覆盖深度受选课数量限制，保守为4.5。","practice":"全日制项目明确要求团队capstone，配合技术课和工程领导力课程，强调工程实施与团队协作。","industry":"课程页说明行业合作人员互动、职业服务和校友行业联系，并设capstone项目匹配；有参与渠道，但不代表进入BAIR或企业岗位的保证。","breadth":"BAIR覆盖ML、CV、NLP、机器人；EECS MEng另有Computer Systems方向，五类均确认。"},"sources":[{"label":"MEng项目与申请要求","url":"https://eecs.berkeley.edu/academics/graduate/industry-programs/meng/"},{"label":"MEng数据科学课程","url":"https://eecs.berkeley.edu/book/meng-guide/requirements/ds/"},{"label":"BAIR研究环境","url":"https://bair.berkeley.edu/about.html"},{"label":"2027秋研究生最低申请及语言要求","url":"https://grad.berkeley.edu/admissions/application-process/requirements/"}]},{"school":"牛津大学","region":"英国","ratings":{"research":4.5,"foundation":5,"practice":4,"industry":4,"breadth":4},"evidence":{"research":"计算机系AI/ML主题包含强化学习、深度学习、语言、机器人、知识表示和多智能体等研究群体。","foundation":"项目明确强调计算模型、程序与算法数学分析，并涵盖安全、验证等高级CS主题，计算机理论基础完整。","practice":"选修课部分含实验，每人完成导师指导的独立dissertation；研究实践明确，但未核实强制企业实习。","industry":"课程页明确部分模块经行业咨询合作开发；AI/ML研究页列与DeepMind等产业伙伴合作，构成稳定合作证据。","breadth":"本次直接确认ML、NLP、计算系统/程序验证、机器人四类；未将计算机系的视觉方向计入本轮证据。"},"sources":[{"label":"2027/28项目、要求与课程","url":"https://www.ox.ac.uk/admissions/graduate/courses/msc-advanced-computer-science"},{"label":"AI与机器学习研究及产业合作","url":"https://www.cs.ox.ac.uk/research/ai_ml/"}]},{"school":"剑桥大学","region":"英国","ratings":{"research":4.5,"foundation":3.5,"practice":4,"industry":null,"breadth":4},"evidence":{"research":"工程系Machine Intelligence Laboratory覆盖语言、视觉、机器人等；项目各方向衔接这些研究主题与导师指导论文。","foundation":"共同核心重视机器学习、深度学习和概率方法；通用操作系统、数据库与软件工程未作为此项目系统训练证据，保守评价。","practice":"实践模块和研究项目明确以算法、建模软件实现为核心，并完成较大研究项目及论文。","industry":"证据不足，暂不评分。官方FAQ明确不允许在MPhil期间抽出时间去企业实习，也不允许在课程期间另行工作；这不等于学院没有产学合作，但本次未核到足够的项目级合作参与机制。","breadth":"课程明确ML、CV、语音语言、机器人四类；未把计算系统计入。"},"sources":[{"label":"MPhil项目与学制","url":"https://www.postgraduate.study.cam.ac.uk/courses/directory/egegmpmsl"},{"label":"课程结构与研究项目","url":"https://www.mlmi.eng.cam.ac.uk/about-programme/course-structure"},{"label":"2026方向与模块","url":"https://www.mlmi.eng.cam.ac.uk/indicative-outline-course-structure"},{"label":"机器智能实验室","url":"https://www.eng.cam.ac.uk/node/8"},{"label":"官方FAQ：研究项目及实习限制","url":"https://www.mlmi.eng.cam.ac.uk/frequently-asked-questions"}]},{"school":"帝国理工学院","region":"英国","ratings":{"research":4.5,"foundation":4.5,"practice":4,"industry":3.5,"breadth":4},"evidence":{"research":"该项目规格文件说明计算机系有AI、数据科学、视觉计算等研究组，教学与这些研究方向紧密联系。","foundation":"项目建立在较充分的计算机先修课上，采用必修、核心和选修结合；学院覆盖编程语言、软件工程、理论算法等。先修要求不能替代实际硕士选课。","practice":"项目规格文件明确5—9月完成主要个人项目，产出论文和口头答辩；有实作研究，但此次未核强制企业capstone。","industry":"项目规格文件说明部门有行业合作；未核此项目稳定的具体企业项目名额与参与机制，保守评价。","breadth":"已核AI/ML、视觉、自然语言处理及软件/计算系统相关方向；本轮不把其他MSc的机器人课程直接计入该代表项目。"},"sources":[{"label":"项目、2027学制与最低要求","url":"https://www.imperial.ac.uk/study/courses/postgraduate-taught/computing-artificial-intelligence-msc/?addCourse=1194116"},{"label":"学院项目介绍与外部申请准备","url":"https://www.imperial.ac.uk/computing/prospective-students/pg/msc-specialist-degrees/aiml/"},{"label":"2024/25项目规格及研究实践","url":"https://www.imperial.ac.uk/media/imperial-college/study/programme-specifications/computing/24x2f25/G5U10-MSc-Computing-%28AIML%29-2024-25.pdf"}]},{"school":"伦敦大学学院","region":"英国","ratings":{"research":4.5,"foundation":3.5,"practice":4,"industry":4.5,"breadth":3},"evidence":{"research":"课程与Gatsby Computational Neuroscience Unit及Google DeepMind合作，具有明确的计算统计与机器学习研究环境。","foundation":"核心和选修集中在监督、概率、推断及高级机器学习；本项目并非覆盖完整操作系统、数据库、软件工程的通用CS培养，保守评分。","practice":"每人完成较大研究项目，可为学术主题或行业合作主题；另有实验、课程作业，实践路径明确。","industry":"官方页面明确Google DeepMind合作模块、行业伙伴研究项目及IXN/职业活动，有多类可见学生参与渠道。","breadth":"直接核实ML、统计自然语言处理、Machine Vision三类；未将通用计算系统与机器人计入。"},"sources":[{"label":"2026/27课程、合作与学费","url":"https://www.ucl.ac.uk/prospective-students/graduate/taught-degrees/machine-learning-msc-2026"},{"label":"项目与申请门槛","url":"https://www.ucl.ac.uk/study/prospective-students/graduate/courses/machine-learning-msc"}]},{"school":"苏黎世联邦理工学院","region":"瑞士","ratings":{"research":4.5,"foundation":5,"practice":4.5,"industry":4.5,"breadth":5},"evidence":{"research":"ETH AI Center汇聚多院系AI基础与应用研究，另有国家级开放AI与语言模型倡议，可核实跨团队环境与持续工作。","foundation":"CS硕士方向包括数据管理、机器智能、安全可靠系统、视觉交互、理论CS，覆盖算法、系统、软件等主要基础。","practice":"硕士论文与跨学科项目明确；AI Center提供学期和论文项目，实验室也公开Research in Computer Science及实践项目。","industry":"AI Center有企业合作和本科/硕士论文匹配机制，也有学生参与的Data Science Lab项目；并非保证每名学生进入企业课题。","breadth":"CS方向确认ML、CV、计算系统；跨学科机器人论文与AI Center语言模型倡议补足机器人和NLP，共五类。"},"sources":[{"label":"CS硕士项目、外部背景与学制","url":"https://ethz.ch/en/studies/master/degree-programmes/engineering-sciences/computer-science.html"},{"label":"AI Center","url":"https://ai.ethz.ch/"},{"label":"AI研究倡议","url":"https://ai.ethz.ch/about-us/Our-Initiatives.html"},{"label":"学期与论文项目","url":"https://ai.ethz.ch/education/thesis-stud.html"},{"label":"企业合作与学生论文机制","url":"https://ai.ethz.ch/industry/partnership-packages.html"},{"label":"行业项目合作","url":"https://ai.ethz.ch/industry/corporatepartnership.html"},{"label":"计算机系学生实践项目","url":"https://plf.inf.ethz.ch/education/student-projects.html"},{"label":"计算机硕士申请材料与C1要求","url":"https://ethz.ch/en/studies/master/application/master-informatik.html"},{"label":"认可语言证明与豁免条件","url":"https://ethz.ch/en/studium/master/bewerbung/sprachanforderungen.html"}]},{"school":"洛桑联邦理工学院","region":"瑞士","ratings":{"research":4.5,"foundation":5,"practice":5,"industry":4.5,"breadth":5},"evidence":{"research":"IC学院有多个AI/ML、视觉、NLP研究实验室；跨学院机器人中心和近期开放语言模型工作体现持续研究环境。","foundation":"硕士实验室与培养范围包括算法理论、体系结构、分布式计算、操作系统网络、编程语言、数据管理等，CS基础完整。","practice":"30 ECTS硕士项目明确；若项目在校内或其他高校完成，此前须完成核准的8周或6个月企业实习。可在行业中完成较长硕士项目。","industry":"企业实习与行业硕士项目具有正式培养机制，机器人中心也连接企业、创业公司与学生；岗位选择和录用依然需要申请。","breadth":"IC项目实验室确认ML、CV、NLP、计算系统；硕士课程与跨学院认可实验室含机器人，五类均有证据。"},"sources":[{"label":"CS硕士及外校申请资格","url":"https://www.epfl.ch/education/master/programs/computer-science/"},{"label":"项目结构与实习要求","url":"https://www.epfl.ch/schools/ic/education/master/computer-science/program-structure/"},{"label":"硕 function estimateText(e,unit){return e?`约 ${e.low}–${e.high} ${unit} · ${e.year}估算 · ${e.confidence}可信度；${e.basis}`:'';}
function estimateCell(e,unit){return `<b class="estimate-value">约 ${e.low}–${e.high}<span> ${unit}</span></b><span class="estimate-badge">${e.year} 估算参考</span><small class="catalog-muted">可信度：${esc(e.confidence)}</small><details class="estimate-basis"><summary>估算依据</summary><p>${esc(e.basis)}</p>${e.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label)} ↗</a>`).join('')}</details>`;}
function scoreCell(p){if(p.id==='sjtu-ai-special')return '<b class="quota-number">不适用</b><small class="catalog-muted">推免专项</small>';if(p.score===null)return p.scoreEstimate?estimateCell(p.scoreEstimate,'分'):'<small class="catalog-muted">暂无足够依据</small>';return `<div class="table-score"><b>${p.score}<span> 分</span></b><small>${scoreCaption(p)}</small>${p.historicalIdentity?`<small>${esc(p.historicalIdentity)}</small>`:''}${p.median!==null?`<small>中位数 ${p.median} 分</small>`:''}</div>`;}
function supportingCell(p){const a=p.admissions;return `${a?`<span class="admission-status ${a.programVerified?'confirmed':''}">2027 · ${esc(a.status)}</span><small class="catalog-muted">${esc(a.kind)}</small>`:''}<div class="source-line">${(a?.sources||p.sources.slice(0,1)).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label)} ↗</a>`).join('')}</div>`;}
function admissionGroup(p){return p.admissions?(p.admissions.programVerified?'专业已核验':p.admissions.kind==='统考科目调整公告'?'科目已核验':'目录待核验'):'未纳入本轮';}
function codeLabel(p){return p.code+(p.admissions&&!p.admissions.codeVerified&&p.code?'（往年）':'');}
function admissionCard(p){const a=p.admissions;return a?`<div class="admission-info"><span class="admission-status ${a.programVerified||a.kind==='统考科目调整公告'?'confirmed':''}">2027 · ${esc(a.status)}</span><p>${esc(a.summary)}</p></div>`:'';}
function admissionDetail(p){const a=p.admissions;return a?`<p class="detail-title">2027 招生 · ${esc(a.status)}</p><p class="detail-text">${esc(a.note)}</p><p class="help">依据：${esc(a.kind)}${a.published?' · 发布 '+esc(a.published):''} · 核对 ${esc(a.checked)}</p>`:'';}
function scoreCaption(p){return p.score===null?'学院复试线未核验':p.scoreType==='拟录取统计'?`${p.year} 拟录取初试最低`:`${p.year} 复试线`;}
function totalWeight(){return dimensions.reduce((a,d)=>a+weights[d.key],0);}
function points(s){return s&&dimensions.every(d=>Number.isFinite(s.ratings[d.key]))?dimensions.reduce((a,d)=>a+(s.ratings[d.key]/5)*weights[d.key],0)*100/totalWeight():null;}
function currentRanking(){const cohort=schools.filter(s=>(s.region==='中国内地')===(state.scope==='mainland'));cohort.sort((a,b)=>(points(b)??-1)-(points(a)??-1)||(b.ratings.research??0)-(a.ratings.research??0)||(b.ratings.practice??0)-(a.ratings.practice??0)||a.school.localeCompare(b.school,'zh-CN'));rankMap=new Map();let i=0;for(const s of cohort)if(points(s)!==null)rankMap.set(s.school,++i);ranked=cohort;return cohort;}
function weightUI(){const sum=totalWeight();$('profile').value=profile;for(const d of dimensions){$('w-'+d.key).value=weights[d.key];$('w-label-'+d.key).textContent=(weights[d.key]*100/sum).toFixed(sum===100?0:1)+'%';}$('weight-total').textContent='合计 '+sum+' · 自动归一化';}
function rankingTitle(s){return rankMap.has(s.school)?'NO. '+String(rankMap.get(s.school)).padStart(2,'0'):'待补证据';}
function sourceLinks(p,first=false){return (first?p.sources.slice(0,1):p.sources).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a>`).join('');}
for(const [id,values] of [['region',[...new Set(P.map(p=>isDomestic(p)?p.city:p.region))]],['degree',[...new Set(P.map(p=>p.degree))]]])for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o);}
for(const id of ['region','level','degree','track','admissionStatus','scoreType','maxScore','currency','sort'])if(![...$(id).options].some(o=>o.value===state[id]))state[id]=defaults[id];
if(!['mainland','abroad'].includes(state.scope))state.scope='mainland';
if(!state.currency)state.maxFee='';
function sync(){for(const k of Object.keys(defaults)){if(k==='scope')continue;const el=$(k);if(el)el.type==='checkbox'?el.checked=state[k]:el.value=state[k];}
document.querySelectorAll('[data-scope]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.scope===state.scope));b.tabIndex=b.dataset.scope===state.scope?0:-1;});$('ranking-panel').setAttribute('aria-labelledby','tab-'+state.scope);$('level-field').hidden=state.scope==='abroad';$('domestic-filters').hidden=state.scope==='abroad';$('foreign-filters').hidden=state.scope==='mainland';
const regionOptions=[...new Set(P.filter(p=>isDomestic(p)===(state.scope==='mainland')).map(p=>isDomestic(p)?p.city:p.region))];if(!regionOptions.includes(state.region))state.region='';$('region-label').textContent=state.scope==='mainland'?'城市':'国家 / 地区';$('region').innerHTML='<option value="">'+(state.scope==='mainland'?'全部城市':'全部地区')+'</option>'+regionOptions.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');$('region').value=state.region;
const degrees=[...new Set(P.filter(p=>isDomestic(p)===(state.scope==='mainland')).map(p=>p.degree))];$('degree').innerHTML='<option value="">全部类型</option>'+degrees.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');$('degree').value=state.degree;
$('maxFee').disabled=!state.currency;$('maxFee').placeholder=state.currency?(state.currency==='CNY'?'人民币元，如 300000':'输入原币金额'):'先选择币种';$('sort').querySelector('[value=score]').disabled=state.scope==='abroad';if(state.maxScore||state.currency||state.scoreType)$('advanced').open=true;weightUI();}
function filtered(){const q=state.q.trim().toLocaleLowerCase();const cohort=currentRanking();const eligible=state.showAll?cohort:cohort.filter(s=>points(s)!==null).slice(0,state.scope==='mainland'?20:10);const allowed=new Set(eligible.map(s=>s.school));let list=P.filter(p=>{
 if(!allowed.has(p.school))return false;
 if(state.scope==='mainland'&&!isDomestic(p)||state.scope==='abroad'&&isDomestic(p))return false;
 if(state.region&&(isDomestic(p)?p.city!==state.region:p.region!==state.region)||state.level&&p.level!==state.level||state.degree&&p.degree!==state.degree||state.track&&!p.track.includes(state.track)||state.scoreType&&p.scoreType!==state.scoreType)return false;
 if(state.admissionStatus&&admissionGroup(p)!==state.admissionStatus)return false;
 if(state.maxScore&&(!isCutoff(p)||p.score===null||p.score>Number(state.maxScore)))return false;
 if(state.sort==='score'&&(!isCutoff(p)||p.score===null))return false;
 if(state.scope==='abroad'&&state.currency&&state.currency!=='CNY'&&p.tuition?.currency!==state.currency)return false;
 if(state.scope==='abroad'&&state.currency&&state.maxFee!==''){const fee=state.currency==='CNY'?rmbAmount(p):p.tuition?.amount;if(fee==null||fee>Number(state.maxFee))return false;}
 if(state.favoritesOnly&&!favorites.has(p.id))return false;
 if(q&&!`${p.school} ${p.schoolEn} ${p.college} ${p.program} ${p.code} ${p.city} ${p.region} ${p.track.join(' ')} ${p.reason} ${p.historicalIdentity||''} ${p.admissions?.summary||''} ${p.admissions?.status||''} ${p.catalog?catalogText(p,'directions')+' '+catalogText(p,'exams'):''}`.toLocaleLowerCase().includes(q))return false;
 return true;});
 if(state.sort==='default')list.sort((a,b)=>(rankMap.get(a.school)||999)-(rankMap.get(b.school)||999));if(state.sort==='school')list.sort((a,b)=>a.school.localeCompare(b.school,'zh-CN'));if(state.sort==='score')list.sort((a,b)=>a.score-b.score);return list;}
function actions(p){return `<div class="row-actions"><div class="action-left"><button type="button" class="btn" data-action="detail" data-id="${p.id}" aria-label="查看${esc(p.school+' '+p.program)}详情">详情</button><button type="button" class="btn favorite" data-action="favorite" data-id="${p.id}" aria-pressed="${favorites.has(p.id)}" aria-label="${favorites.has(p.id)?'取消收藏':'收藏'}${esc(p.school+' '+p.program)}">${favorites.has(p.id)?'★ 已收藏':'☆ 收藏'}</button></div><label class="check"><input type="checkbox" data-action="compare" data-id="${p.id}" ${comparison.has(p.id)?'checked':''} aria-label="对比${esc(p.school+' '+p.program)}">加入对比</label></div>`;}

function catalogText(p,field){if(field==='quota'&&p.quotaEstimate&&p.catalog?.quota.value===null)return estimateText(p.quotaEstimate,'人');const c=p.catalog;if(!c)return '未纳入本轮核验';if(field==='directions')return [c.directionLabel,...c.directions,c.directionStatus].filter(Boolean).join('；');if(field==='exams')return [...c.exams,c.examStatus].filter(Boolean).join('；');return (c.quota.value===null?c.quota.status:c.quota.value+' 人')+'；'+c.quota.note;}
function catalogCell(p,field){if(field==='quota'&&p.quotaEstimate&&p.catalog?.quota.value===null)return estimateCell(p.quotaEstimate,'人');const c=p.catalog;if(!c)return '<span class="catalog-muted">未纳入本轮核验</span>';if(field==='directions'){const full=c.directions.map(x=>`<li>${esc(x)}</li>`);return `${c.directionLabel?`<strong class="direction-label">${esc(c.directionLabel)}</strong>`:''}${full.length?`<ul class="catalog-list">${full.slice(0,6).join('')}</ul>${full.length>6?`<details class="more-directions"><summary>展开其余 ${full.length-6} 个方向</summary><ul class="catalog-list">${full.slice(6).join('')}</ul></details>`:''}`:''}<small class="catalog-muted">${esc(c.directionStatus)}</small>`;}if(field==='exams')return `${c.exams.length?`<ul class="exam-list">${c.exams.map(x=>`<li><span>${esc(x.slice(0,3))}</span>${esc(x.slice(4))}</li>`).join('')}</ul>`:''}<small class="catalog-muted">${esc(c.examStatus)}</small>`;return `<b class="quota-number">${c.quota.value===null?esc(c.quota.status):c.quota.value+'<span> 人</span>'}</b><small class="catalog-muted">${c.quota.value!==null?esc(c.quota.status)+' · ':''}${esc(c.quota.note)}</small>`;}
function catalogDetail(p){return p.catalog?`<div class="catalog-detail"><section><h3>具体研究方向</h3>${catalogCell(p,'directions')}</section><section><h3>考试科目</h3>${catalogCell(p,'exams')}</section><section><h3>统考生名额</h3>${catalogCell(p,'quota')}</section></div>${p.catalog.remarks?`<p class="detail-note">${esc(p.catalog.remarks)}</p>`:''}`:'';}
function domesticSchool(group){const p=group[0],sm=schoolMap.get(p.school),score=points(sm);return `<section class="school-card school-table-card domestic-school" aria-label="${esc(p.school)}"><header class="school-overview"><div><div class="school-kicker"><span class="rank-num">${rankingTitle(sm)}</span><span class="level">${esc(p.level)}</span><span>${esc([...new Set(group.map(x=>x.city))].join(' / '))}</span><span>${group.length} 个项目</span></div><h3 class="school-name">${esc(p.school)}</h3><p class="school-summary">${esc(p.reason)}</p></div><div class="rank-score"><b>${score===null?'—':score.toFixed(1)}</b><small>综合分 / 100</small><button class="btn linklike" type="button" data-action="school-model" data-school="${esc(p.school)}">评分依据 ↗</button></div></header><div class="program-table-wrap"><table class="program-table"><caption class="sr-only">${esc(p.school)}专业招生明细</caption><colgroup><col style="width:18%"><col style="width:20%"><col style="width:16%"><col style="width:13%"><col style="width:12%"><col style="width:13%"><col style="width:8%"></colgroup><thead><tr><th scope="col">学院 / 招生专业</th><th scope="col">具体研究方向</th><th scope="col">考试科目</th><th scope="col">统考生名额</th><th scope="col">历史分数</th><th scope="col">支撑材料</th><th scope="col">操作</th></tr></thead><tbody>${group.map(x=>`<tr data-program-id="${x.id}"><td data-label="学院 / 招生专业"><p class="college">${esc(x.college)}</p><h4 class="program-name">${esc(x.program)}</h4><p class="meta">${esc(codeLabel(x)||'代码待核验')} · ${esc(x.degree)} · 全日制</p></td><td data-label="具体研究方向">${catalogCell(x,'directions')}</td><td data-label="考试科目">${catalogCell(x,'exams')}</td><td data-label="统考生名额">${catalogCell(x,'quota')}</td><td data-label="历史分数">${scoreCell(x)}</td><td data-label="支撑材料">${supportingCell(x)}</td><td data-label="操作">${actions(x)}</td></tr>`).join('')}</tbody></table></div></section>`;}

function programRow(p){const domestic=isDomestic(p);let metric=domestic?`<div class="metric ${p.score===null?'pending':p.median!==null?'statistic':''}"><b>${p.score===null?'待核验':p.score}</b>${p.score===null?'':'<span class="unit">分</span>'}<small>${scoreCaption(p)}</small>${p.median!==null?`<p class="median">中位数 ${p.median} 分</p>`:''}</div>`:`<div class="metric international"><b>${esc(durationShort(p)||'待核验')}</b><small>全日制 · 申请制</small></div>`;
return `<article class="program-row" data-program-id="${p.id}"><p class="college">${esc(p.college)}</p><div class="program-line"><div><h4 class="program-name">${esc(p.program)}</h4><p class="meta">${p.code?esc(codeLabel(p))+' · ':p.admissions?.programVerified?'代码待核验 · ':''}${esc(p.degree)}${domestic?' · 全日制':''}${p.admissionYear?' · '+esc(p.admissionYear)+'招生':''}</p></div>${metric}</div>${!domestic?`<div class="abroad-info"><div class="fee">${tuition(p)} <span class="help">${esc(p.tuition?.label||'')}</span></div><p>费用适用：${esc(p.tuition?.year||'金额与适用学年待核验')} · 不含生活费</p><p>${esc(p.requirements||'申请要求请见官方项目页。')}</p></div>`:''}${domestic?admissionCard(p):''}${actions(p)}<div class="source-line">${sourceLinks(p,true)}</div></article>`;}

function tuitionCell(p,expanded=false){const t=p.tuition;if(!t)return '待补充';const conversion=`1 ${t.currency} ≈ ${DATA.fx.rates[t.currency]} 元 · ${DATA.fx.date} 中间价`;const basis=`<p>${esc(t.basis||'')}</p><a href="${esc(t.sourceUrl)}" target="_blank" rel="noopener noreferrer">${t.status==='第三方参考估算'?'第三方参考':'官方收费来源'} ↗</a><p class="fx-note">${conversion}。人民币金额仅供预算，实际支付受汇率和手续费影响。</p><a href="${esc(DATA.fx.sourceUrl)}" target="_blank" rel="noopener noreferrer">汇率来源 ↗</a>`;return `<div class="fee-total">${tuition(p)}</div><div class="fee-original">${originalTuition(p)} · ${esc(t.currency)}</div><div class="fee-label">${esc(t.label)}</div><span class="fee-status ${t.estimated?'estimated':''}">${esc(t.status||'参考费用')}</span><span class="catalog-muted">${esc(t.year)}</span><p class="fee-note">${esc(t.note||'不含生活费')}</p>${expanded?`<div class="fee-basis">${basis}</div>`:`<details class="fee-calculation"><summary>费用与换算依据</summary>${basis}</details>`}`;}

function abroadSchool(group){const p=group[0],sm=schoolMap.get(p.school),score=points(sm);return `<section class="school-card school-table-card abroad-school" aria-label="${esc(p.school)}"><header class="school-overview"><div><div class="school-kicker"><span class="rank-num">${rankingTitle(sm)}</span><span class="level abroad">${esc(p.region)}</span><span>${esc(p.city)}</span><span>${group.length} 个项目</span></div><h3 class="school-name">${esc(p.school)}</h3><p class="school-en">${esc(p.schoolEn)}</p><p class="school-summary">${esc(p.reason)}</p></div><div class="rank-score"><b>${score===null?'—':score.toFixed(1)}</b><small>综合分 / 100</small><button type="button" class="btn linklike" data-action="school-model" data-school="${esc(p.school)}">评分依据 ↗</button></div></header><div class="program-table-wrap"><table class="program-table abroad-table"><caption class="sr-only">${esc(p.school)}境外项目明细</caption><colgroup><col style="width:25%"><col style="width:14%"><col style="width:28%"><col style="width:21%"><col style="width:12%"></colgroup><thead><tr><th scope="col">学院 / 招生项目</th><th scope="col">学习时长</th><th scope="col">全程学费（人民币）</th><th scope="col">申请要求</th><th scope="col">操作</th></tr></thead><tbody>${group.map(x=>`<tr data-program-id="${x.id}"><td data-label="学院 / 招生项目"><p class="college">${esc(x.college)}</p><h4 class="program-name">${esc(x.program)}</h4><p class="meta">${esc(x.degree)} · 申请制</p><div class="tracks">${x.track.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></td><td data-label="学习时长"><div class="duration-value">${esc(durationShort(x))}</div><span class="catalog-muted">全日制</span></td><td data-label="全程学费（人民币）">${tuitionCell(x)}</td><td data-label="申请要求">${requirementsList(x)}</td><td data-label="操作">${actions(x)}</td></tr>`).join('')}</tbody></table></div></section>`;}

function render(){const focused=document.activeElement;const restore=focused?.dataset?.id?{id:focused.dataset.id,action:focused.dataset.action}:null;visible=filtered();const grouped=new Map();for(const p of visible){if(!grouped.has(p.school))grouped.set(p.school,[]);grouped.get(p.school).push(p);}let groups=[...grouped.values()];if(state.sort==='score')groups.sort((a,b)=>Math.min(...a.map(p=>p.score))-Math.min(...b.map(p=>p.score)));
$('cards').classList.add('domestic-tables');$('cards').classList.toggle('abroad-tables',state.scope!=='mainland');$('cards').innerHTML=groups.map(group=>isDomestic(group[0])?domesticSchool(group):abroadSchool(group)).join('');
$('result-count').innerHTML=`显示 <strong>${grouped.size}</strong> 所学校 · <strong>${visible.length}</strong> 个专业项目`;$('empty').hidden=visible.length>0;$('favorite-count').textContent=`(${favorites.size})`;
const chips=[];for(const k of ['q','region','level','degree','track','admissionStatus','scoreType'])if(state[k])chips.push(k==='q'?`搜索：${state[k]}`:state[k]);if(state.maxScore)chips.push(`仅复试线 ≤ ${state.maxScore} 分`);if(state.sort==='score')chips.push('仅复试项目 · 学校按最低复试线排序');if(state.currency)chips.push(state.currency+(state.maxFee!==''?` 学费 ≤ ${Number(state.maxFee).toLocaleString()}`:''));if(state.favoritesOnly)chips.push('仅收藏');if(state.showAll)chips.push('完整候选池');$('active-filters').innerHTML=chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('');
updateDock();save();if(restore){const b=$('cards').querySelector(`[data-action="${restore.action}"][data-id="${restore.id}"]`);if(b)b.focus({preventScroll:true});}}
function updateDock(){$('compare-dock').hidden=comparison.size===0;$('dock-count').textContent=`已选 ${comparison.size} / 4 个项目`;$('dock-names').textContent=[...comparison].map(id=>{const p=byId.get(id);return p.school+' · '+p.program;}).join('  /  ');$('open-compare').textContent=comparison.size<2?'查看项目 →':'查看对比 →';}
function reset(){const scope=state.scope;state={...defaults,scope};sync();render();}
function toggleCompare(id){if(comparison.has(id)){comparison.delete(id);}else if(comparison.size>=4){toast('最多对比 4 个项目，请先取消一个。');return false;}else comparison.add(id);render();return true;}
function detail(id){detailId=id;const p=byId.get(id);$('detail-heading').textContent=p.school+' · '+p.program;$('detail-subtitle').textContent=`${p.college} · ${isDomestic(p)?(p.code?codeLabel(p):'代码待核验')+' · ':''}${p.degree}`;const domestic=isDomestic(p);let metrics=domestic?`<div class="detail-stat">${scoreCell(p)}</div>${p.median!==null?`<div class="detail-stat"><b>${p.median} 分</b><span>拟录取者初试中位数</span></div><div class="detail-stat"><b>${p.n} 人</b><span>统计样本 · 普通全日制</span></div>`:''}`:`<div class="detail-stat"><b>${esc(p.duration||'未核验')}</b><span>全日制学制</span></div><div class="detail-stat fee-detail">${tuitionCell(p,true)}</div>`;
$('detail-body').innerHTML=`${domestic?admissionDetail(p)+catalogDetail(p):''}<p class="detail-title">${domestic?'历史分数参考':'学制与学费'}</p><div class="detail-stats">${metrics}</div><p class="detail-note">${esc(p.caveat||'请以申请当年的官方招生要求为准。')}</p>${!domestic?`<p class="detail-title">申请门槛摘要</p>${requirementsList(p)}<p class="help">以上为最低要求摘要，不是实际录取保证；生活费及其他支出另计。</p>`:`<p class="detail-title">报考时需核对</p><p class="detail-text">总分之外还须满足单科要求。请核对当年招生目录、统考名额、考试科目及学院复试规则；不同试卷的总分不宜直接比较。</p>`}<p class="detail-title">认可度依据与推荐理由</p><p class="detail-text">${esc(p.reason)}</p><p class="detail-title">适合关注的方向</p><div class="tracks">${p.track.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="detail-title">资料来源</p><div class="detail-links">${sourceLinks(p)}</div><div class="detail-buttons"><button type="button" class="btn" data-action="favorite-detail" data-id="${id}" aria-pressed="${favorites.has(id)}">${favorites.has(id)?'★ 已收藏':'☆ 收藏项目'}</button><button type="button" class="btn primary" data-action="compare-detail" data-id="${id}">${comparison.has(id)?'从对比中移除':'加入项目对比'}</button></div>`;
if(!$('detail-dialog').open)$('detail-dialog').showModal();}
function compare(){const items=[...comparison].map(id=>byId.get(id));if(!items.length)return;const rows=[['模型专业度',p=>{const sm=schoolMap.get(p.school);const val=points(sm);return `<p class="score-compare">${val===null?'待补证据':val.toFixed(1)+' / 100'}</p><p>五维人工等级加权 · 非录取分</p><p>${dimensions.map(d=>d.short+' '+(sm.ratings[d.key]??'待核')+'/5').join(' · ')}</p>`;}],['学校与专业',p=>`<p class="school-name">${esc(p.school)}</p><p><strong>${esc(p.program)}</strong></p><p class="help">${isDomestic(p)?esc(codeLabel(p)||'代码待核验')+' ':''}${esc(p.degree)}</p>`],['地区与学院',p=>`${esc(place(p))}<p>${esc(p.college)}</p>`],['具体研究方向',p=>isDomestic(p)?catalogCell(p,'directions'):'见项目详情'],['考试科目',p=>isDomestic(p)?catalogCell(p,'exams'):'申请制'],['统考生名额',p=>isDomestic(p)?catalogCell(p,'quota'):'不适用'],['2027 招生',p=>p.admissions?`<p><strong>${esc(p.admissions.status)}</strong></p><p>${esc(p.admissions.note)}</p>`:'未纳入本轮国内招生更新'],['分数 / 申请要求',p=>isDomestic(p)?scoreCell(p):requirementsList(p)],['学制与学费',p=>isDomestic(p)?'本次未收录；请查当年培养与收费文件':`<p>${esc(p.duration||'学制未核验')}</p>${tuitionCell(p,true)}`],['职业方向',p=>p.track.map(esc).join(' / ')],['推荐理由',p=>esc(p.reason)],['口径与限制',p=>esc(p.caveat)],['资料来源',p=>sourceLinks(p)],['操作',p=>`<button type="button" class="btn" data-action="remove-compare" data-id="${p.id}">移出对比</button>`]];
$('compare-body').innerHTML=`<table class="compare-table" style="min-width:${125+items.length*235}px"><caption class="sr-only">已选 ${items.length} 个研究生项目的逐项对比</caption><tbody>${rows.map(([name,fn])=>`<tr><th scope="row">${name}</th>${items.map(p=>`<td>${fn(p)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;if(!$('compare-dialog').open)$('compare-dialog').showModal();}
for(const id of Object.keys(defaults).filter(k=>k!=='scope')){const el=$(id);el.addEventListener(el.tagName==='INPUT'&&el.type!=='checkbox'?'input':'change',()=>{state[id]=el.type==='checkbox'?el.checked:el.value;if(id==='currency'){state.maxFee='';sync();}if(id==='maxFee'&&Number(state.maxFee)<0){state.maxFee='0';el.value='0';}render();});}
document.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>{const {showAll}=state;state={...defaults,scope:b.dataset.scope,showAll};sync();render();}));
document.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const target=e.key==='Home'?'mainland':e.key==='End'?'abroad':state.scope==='mainland'?'abroad':'mainland';$('tab-'+target).click();$('tab-'+target).focus();});
$('reset-filters').addEventListener('click',reset);$('open-compare').addEventListener('click',compare);$('clear-compare').addEventListener('click',()=>{comparison.clear();render();});
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){$(close.dataset.close).close();return;}const t=e.target.closest('[data-action]');if(!t)return;const {action,id}=t.dataset;if(action==='school-model'){showModel(t.dataset.school);return;}if(action==='reset'){reset();return;}if(!byId.has(id))return;
if(action==='detail')detail(id);if(action==='favorite'||action==='favorite-detail'){favorites.has(id)?favorites.delete(id):favorites.add(id);render();if(action==='favorite-detail')detail(id);}
if(action==='compare'){toggleCompare(id);t.checked=comparison.has(id);}if(action==='compare-detail'){toggleCompare(id);detail(id);}if(action==='remove-compare'){comparison.delete(id);render();comparison.size?compare():$('compare-dialog').close();}});
for(const id of ['detail-dialog','compare-dialog','model-dialog'])$(id).addEventListener('click',e=>{if(e.target!==$(id))return;const r=$(id).getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$(id).close();});
$('export-csv').addEventListener('click',()=>{if(!visible.length){toast('当前没有可导出的项目。');return;}const header=['学校','模型综合分(100分制)','候选池名次','AI研究等级','计算机基础等级','工程训练等级','产学联系等级','方向覆盖等级','权重配置','地区','城市','层次','学院','专业','代码','学位类型','方向标签','具体研究方向','考试科目','统考生名额','招生年度','2027核验状态','公告类型','2027招生信息','代码已核验2027','核验日期','历史项目','分数口径','年份','复试线或拟录取最低分','拟录取中位数','样本人数','学制','申请要求','学费金额','币种','费用口径','费用适用年份','费用核验状态','是否估算','费用计算依据','费用备注','推荐理由','口径限制','资料来源','分数估算参考（非历史公布值）','折合人民币元','换算汇率（元/原币）','汇率日期'];const rows=visible.map(p=>[p.school,points(schoolMap.get(p.school))?.toFixed(1)??'待补证据',rankMap.get(p.school)??'',...dimensions.map(d=>schoolMap.get(p.school).ratings[d.key]),dimensions.map(d=>d.name+':'+(weights[d.key]*100/totalWeight()).toFixed(1)+'%').join(' | '),p.region,p.city,p.level,p.college,p.program,p.code,p.degree,p.track.join('/'),p.catalog?catalogText(p,'directions'):'',p.catalog?catalogText(p,'exams'):'',p.catalog?catalogText(p,'quota'):'',p.admissions?.year,p.admissions?.status,p.admissions?.kind,p.admissions?.note,p.admissions?.codeVerified,p.admissions?.checked,p.historicalIdentity,p.scoreType,p.year,p.score,p.median,p.n,p.duration,p.requirements,p.tuition?.amount,p.tuition?.currency,p.tuition?.label,p.tuition?.year,p.tuition?.status,p.tuition?.estimated,p.tuition?.basis,p.tuition?.note,p.reason,p.caveat,p.sources.map(s=>s.url).join(' | '),estimateText(p.scoreEstimate,'分'),rmbAmount(p),p.tuition?DATA.fx.rates[p.tuition.currency]:'',p.tuition?DATA.fx.date:'']);const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[header,...rows].map(r=>r.map(quote).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=`AI研究生择校-${state.scope==='mainland'?'国内':'境外'}榜单.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(`已生成 ${visible.length} 个项目的 CSV，开始下载。`);});

function showModel(name){const sm=name?schoolMap.get(name):null;const sum=totalWeight();$('model-heading').textContent=sm?sm.school+' · 评分依据':'评分依据';
const table=dimensions.map(d=>{const r=sm?.ratings[d.key],e=sm?.evidence[d.key];return `<tr><td>${d.name}<p class="help">权重 ${(weights[d.key]*100/sum).toFixed(1)}%</p></td><td>${sm?`<div class="value">${r===null?'待补':r+' / 5'}</div><p class="help">贡献 ${r===null?'—':(r/5*weights[d.key]*100/sum).toFixed(1)} 分</p>`:''}<p>${esc(sm?e:d.rubric)}</p></td></tr>`;}).join('');
$('model-body').innerHTML=`<p class="detail-text">${sm?'评分对象为所列 AI / CS 学院的硕士培养环境。':'依据公开研究与培养资料进行五维人工评分，按所选权重计算；非官方排名。'}</p><div class="score-formula">综合分 = 100 × Σ（维度等级 ÷ 5 × 权重）÷ Σ权重${sm?`<br>当前计算结果：${points(sm)===null?'证据未齐，暂不排名':points(sm).toFixed(1)+' / 100'}`:''}</div><table class="rubric-table"><thead><tr><th scope="col">评价维度</th><th scope="col">${sm?'等级、加权贡献与依据':'统一评分锚点'}</th></tr></thead><tbody>${table}</tbody></table><p class="formula-note new-line">各维度按 0–5 分评级；证据缺失时不排名。分差小于 3 分可视作同档。${sm?'':'方向覆盖按五类研究／培养资源核验计分。'}</p><p class="formula-note new-line">Top 排名仅涵盖本次候选院校。国内与境外分别计算；院线、学费和申请门槛不计分。</p>${sm?`<p class="detail-title">评分参考的官方材料</p><div class="detail-links">${sm.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a>`).join('')}</div>`:`<p class="detail-title">默认权重与适用目标</p><p class="detail-text">AI 开发就业导向：30 / 20 / 25 / 15 / 10；算法研究导向：45 / 20 / 10 / 10 / 15；均衡导向：35 / 20 / 20 / 10 / 15。顺序均为 AI 研究、计算机基础、工程训练、产学联系、方向覆盖。</p><p class="detail-title">纳入与排除</p><p class="detail-text">${esc(RANKING.scopeNote||'内地限原211及以上；境外要求有可供外部本科生申请的相关硕士项目。')}</p>`}`;
if(!$('model-dialog').open)$('model-dialog').showModal();}
$('weight-controls').innerHTML=dimensions.map(d=>`<label class="weight-field"><span>${d.name}<b id="w-label-${d.key}"></b></span><input id="w-${d.key}" type="range" min="0" max="50" step="5" value="${weights[d.key]}" aria-label="${d.name}权重"></label>`).join('');
for(const d of dimensions)$('w-'+d.key).addEventListener('input',()=>{const next=Number($('w-'+d.key).value);if(totalWeight()-weights[d.key]+next===0){toast('请至少保留一项非零权重。');$('w-'+d.key).value=weights[d.key];return;}weights[d.key]=next;profile='custom';weightUI();render();});
$('profile').addEventListener('change',()=>{profile=$('profile').value;if(profile==='custom')$('weight-settings').open=true;if(presets[profile])weights={...presets[profile]};weightUI();render();});
$('reset-weights').addEventListener('click',()=>{profile='employment';weights={...presets.employment};weightUI();render();});
$('model-help').addEventListener('click',()=>showModel());
if(window.matchMedia('(max-width:640px)').matches)$('filterbox').open=false;sync();render();
})();

</script>
</body>
</html>
